id: create-ui-panel
name: Create UI Panel
description: Creates a Unity UI panel with common components like header, content area, and close button.
category: UI
author: Splatter
version: 1.0.0
tags: [ui, canvas, panel, uGUI]
parameters:
  - name: panelName
    type: string
    description: The name of the panel GameObject
    required: true
  - name: includeHeader
    type: boolean
    description: Whether to include a header section with title
    default: true
  - name: includeCloseButton
    type: boolean
    description: Whether to include a close button in the header
    default: true
  - name: width
    type: number
    description: Panel width in pixels
    default: 400
  - name: height
    type: number
    description: Panel height in pixels
    default: 300
instructions: |
  Create a UI panel in the currently open scene following these steps:

  1. Check if a Canvas exists in the scene. If not, create one with:
     - Render Mode: Screen Space - Overlay
     - UI Scale Mode: Scale With Screen Size
     - Reference Resolution: 1920x1080

  2. Create the main panel GameObject under the Canvas:
     - Add Image component with a semi-transparent dark background
     - Set anchors to center
     - Set size based on width/height parameters

  3. If includeHeader is true:
     - Create a Header child object at the top of the panel
     - Add Image component with slightly lighter background
     - Add TextMeshPro - Text component for the title
     - Set the title to the panelName parameter

  4. If includeCloseButton is true (and header exists):
     - Create a CloseButton child in the Header
     - Add Button component
     - Add Image component with X icon or text
     - Position in top-right corner of header

  5. Create a Content child object:
     - Fill remaining space below header
     - Add VerticalLayoutGroup for easy content organization
     - Add ContentSizeFitter if needed

  Use the template prefab as a reference for visual styling.
examples:
  - input: Create a settings panel with header and close button
    output: Created Settings panel (400x300) with header, close button, and content area
  - input: Create a simple notification popup without header
    output: Created Notification panel (400x300) with content area only
  - input: Create a large inventory panel 800x600
    output: Created Inventory panel (800x600) with header, close button, and content area
resources:
  template: templates/panel-template.prefab
  schema: schemas/panel-config.json
  styles: resources/panel-styles.json
